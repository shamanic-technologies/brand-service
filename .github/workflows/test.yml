name: Test

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build TypeScript
        run: pnpm run build

      - name: Run build sanity tests (no legacy imports)
        run: pnpm run test:build

  test:
    runs-on: ubuntu-latest
    needs: build

    # A throwaway Postgres, one per run, inside the runner.
    #
    # This used to be an isolated Neon branch cut per run (issue #385: before
    # that, a push to main/staging ran the integration suite against a LIVE
    # database and `drizzle-kit push --force` reconciled its schema). The Neon
    # project no longer exists — the fleet moved to a self-hosted Postgres — so
    # the create-branch step began failing with a 404 and NOTHING could merge.
    # A service container gives the same guarantee the Neon branch was there
    # for (never a database anything else points at, discarded when the job
    # ends) with no external dependency, no API key, and no cleanup step that
    # can leave a branch behind.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brand_service_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # The migration-stamp guard reads main's journal to prove this branch's new
      # migrations are not stranded. checkout is shallow AND single-branch, so
      # main is absent; the explicit refspec is required because a bare
      # `git fetch origin main` only moves FETCH_HEAD and never creates
      # refs/remotes/origin/main. No `|| true` — a fetch that fails has to
      # surface as the guard's own loud failure, not as a branch nobody checked.
      - name: Fetch main for the migration-stamp guard
        run: git fetch origin main:refs/remotes/origin/main --depth=1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run unit tests
        run: pnpm run test:unit
        env:
          BRAND_SERVICE_API_KEY: test-secret-key
          COMPANY_SERVICE_API_KEY: test-secret-key
          GEMINI_API_KEY: test-gemini-key
          SCRAPING_SERVICE_URL: http://localhost:3010
          SCRAPING_SERVICE_API_KEY: test-scraping-key

      # ALWAYS the throwaway service container. No CI job may hold a DSN for a
      # database anything else points at.
      - name: Set database URL
        # `sslmode=disable` is load-bearing: `src/db/index.ts` requires TLS unless
        # the connection string says otherwise in so many words, and the service
        # container serves plaintext. Without it every query dies as
        # `Client network socket disconnected before secure TLS connection was established`.
        run: echo "DB_URL=postgresql://postgres:postgres@127.0.0.1:5432/brand_service_test?sslmode=disable" >> "$GITHUB_ENV"

      # The database starts EMPTY, so the schema is built from `schema.ts` — the
      # step that was always the authority on drift, and now the only one.
      #
      # `scripts/ci-migrate.ts` no longer runs here. It replayed the journal onto
      # a Neon branch that already carried production's schema, applying only the
      # migrations that branch was missing; the journal cannot build a database
      # from nothing (migrations 0024/0025 were hand-authored against an existing
      # one, so a replay from empty dies on a foreign key to a table that does
      # not exist yet). Nothing about that is new — the suite has always built
      # its schema from `schema.ts` (#386) — but the migration SQL is now first
      # exercised by the boot migrator on staging rather than here. The journal's
      # own guards (`tests/unit/migration-order.test.ts`, the migration-stamp
      # guard above, `src/lib/migration-ledger.ts`) still run on every PR.
      #
      # `drizzle-kit push` reports a failed statement and EXITS 0, abandoning the
      # rest of the run — which on an empty database means silently serving the
      # suite a half-built schema. Fail the job on any error it prints.
      - name: Push schema to database
        run: |
          set -o pipefail
          pnpm exec drizzle-kit push --force 2>&1 | tee /tmp/drizzle-push.log
          if grep -qiE '^error:' /tmp/drizzle-push.log; then
            echo "::error::drizzle-kit push reported an error (and exited 0) — the schema is incomplete."
            exit 1
          fi
        env:
          BRAND_SERVICE_DATABASE_URL: ${{ env.DB_URL }}

      - name: Run integration tests
        run: pnpm run test:integration
        env:
          BRAND_SERVICE_DATABASE_URL: ${{ env.DB_URL }}
          COMPANY_SERVICE_DATABASE_URL: ${{ env.DB_URL }}
          BRAND_SERVICE_API_KEY: test-secret-key
          COMPANY_SERVICE_API_KEY: test-secret-key
          GEMINI_API_KEY: test-gemini-key
          SCRAPING_SERVICE_URL: http://localhost:3010
          SCRAPING_SERVICE_API_KEY: test-scraping-key

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false

      # No cleanup step: the service container dies with the job. The Neon branch
      # this replaced needed one, and a name it derived on its own once deleted
      # nothing and failed every run (`ERROR: Branch pr-387 not found`).

  test-coverage-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for missing tests
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}

          SRC_CHANGED=$(git diff --name-only "$BASE" "$HEAD" | grep -E '^src/(routes|services|middleware|db)/' | grep -v '\.d\.ts$' || true)
          TEST_CHANGED=$(git diff --name-only "$BASE" "$HEAD" | grep -E '^tests/' || true)

          if [ -n "$SRC_CHANGED" ] && [ -z "$TEST_CHANGED" ]; then
            echo "::error::Source files changed but no tests were added or updated."
            echo ""
            echo "Changed source files:"
            echo "$SRC_CHANGED"
            echo ""
            echo "Every change MUST include corresponding tests. Add unit tests in tests/unit/ or integration tests in tests/integration/."
            echo "SRC_FILES<<EOF" >> "$GITHUB_ENV"
            echo "$SRC_CHANGED" >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"
            echo "MISSING_TESTS=true" >> "$GITHUB_ENV"
            exit 1
          else
            echo "Test coverage check passed."
          fi

      - name: Comment on PR if tests are missing
        if: failure() && env.MISSING_TESTS == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const files = process.env.SRC_FILES;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `**Tests required** - Source files changed but no tests were added or updated:\n\`\`\`\n${files}\n\`\`\`\nEvery change must include corresponding tests (unit in \`tests/unit/\` or integration in \`tests/integration/\`).`
            });

  readme-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if README needs updating
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}

          TRIGGER_FILES=$(git diff --name-only "$BASE" "$HEAD" | grep -E '^(src/routes/|src/db/schema\.ts|src/index\.ts|\.env\.example|package\.json|\.github/workflows/)' || true)
          README_CHANGED=$(git diff --name-only "$BASE" "$HEAD" | grep -E '^README\.md$' || true)

          if [ -n "$TRIGGER_FILES" ] && [ -z "$README_CHANGED" ]; then
            echo "::warning::README.md may need updating. These files changed but README.md was not touched:"
            echo "$TRIGGER_FILES"
            echo ""
            echo "NEEDS_UPDATE=true" >> "$GITHUB_ENV"
            echo "CHANGED_FILES<<EOF" >> "$GITHUB_ENV"
            echo "$TRIGGER_FILES" >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"
          else
            echo "README check passed."
          fi

      - name: Comment on PR if README may be stale
        if: env.NEEDS_UPDATE == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const files = process.env.CHANGED_FILES;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `⚠️ **README may need updating**\n\nThe following files changed but \`README.md\` was not updated:\n\`\`\`\n${files}\n\`\`\`\nPlease check if the README sections (API Endpoints, Scripts, Database, Environment Variables, etc.) need to reflect these changes.`
            });
